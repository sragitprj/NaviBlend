[project]
name = "naviblend"
version = "0.2.0"
description = "A Spotify-style Blend for Navidrome and other Subsonic servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "cryptography>=42",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
naviblend = "naviblend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naviblend*"]

[tool.setuptools.package-data]
naviblend = ["templates/*.html", "static/*"]
